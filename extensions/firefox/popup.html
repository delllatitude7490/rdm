<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RDM — Download quietly</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <header><img src="icons/download.svg" width="36" height="36" alt=""><div><h1>RDM</h1><p>Download quietly.</p></div><span class="local">LOCAL</span></header>
    <form id="download-form">
      <label for="url">File URL</label>
      <input id="url" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="16384" placeholder="https://example.com/file.zip" required>
      <button id="use-tab" type="button" class="secondary">Use current tab</button>
      <p class="hint">Direct HTTP / HTTPS files. No automatic interception.</p>
      <button id="send" type="submit" class="primary">Download with RDM <span aria-hidden="true">↓</span></button>
    </form>
    <p id="status" role="status" aria-live="polite">Choose a file link. Downloads go to RDM's configured folder.</p>
    <div class="tools"><button id="check" class="text-button" type="button">Check connection</button><a href="setup.html" target="_blank" rel="noopener">Setup &amp; privacy</a></div>
    <footer>RDM keeps downloading when Firefox closes.</footer>
  </main>
</body>
</html>
