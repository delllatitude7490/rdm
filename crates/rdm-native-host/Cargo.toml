[package]
name = "rdm-native-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rdm-ipc = { path = "../rdm-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros"] }

[dev-dependencies]
tempfile = "3"
