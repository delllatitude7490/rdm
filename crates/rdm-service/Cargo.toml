[package]
name = "rdm-service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rdm = { path = "../.." }
rdm-ipc = { path = "../rdm-ipc" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false }
dirs = "6"
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
# Service-only, bundled SQLite: no system daemon and reproducible builds.
rusqlite = { version = "0.38", features = ["bundled"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
futures-util = "0.3"
