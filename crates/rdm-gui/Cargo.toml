[package]
name = "rdm-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
# Start with software rendering. Benchmark before selecting a GPU backend.
default = []
gpu = ["iced/wgpu"]

[dependencies]
rdm = { path = "../.." }
rdm-ipc = { path = "../rdm-ipc" }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "linux-theme-detection"] }
tokio = { version = "1", features = ["sync", "fs", "time"] }
