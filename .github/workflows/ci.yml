name: CI

on:
  push:
    paths-ignore:
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths-ignore:
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

  gui:
    name: Native GUI / IPC / service
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: iced-gui

      - name: Format native crates
        run: cargo fmt -p rdm-gui -p rdm-ipc -p rdm-service -p rdm-native-host --check

      - name: Check native crates
        run: cargo check -p rdm-gui -p rdm-ipc -p rdm-service -p rdm-native-host --all-targets --locked

      - name: Lint native crates
        run: cargo clippy -p rdm-gui -p rdm-ipc -p rdm-service -p rdm-native-host --all-targets --locked -- -D warnings

      - name: Test native crates and service lifecycle
        run: cargo test -p rdm-gui -p rdm-ipc -p rdm-service -p rdm-native-host --locked

      - name: Build Firefox native binaries
        run: cargo build -p rdm -p rdm-service -p rdm-native-host --locked

      - name: Test CLI against real service
        run: |
          python3 tests/cli_service_smoke.py target/debug
          python3 tests/cli_protocol_smoke.py target/debug
          python3 tests/service_queue_smoke.py target/debug
          python3 tests/service_persistence_smoke.py target/debug
          python3 tests/service_pause_smoke.py target/debug
          python3 tests/service_remove_smoke.py target/debug

      - name: Test Firefox native stdio to real service
        run: python3 extensions/firefox/tests/native_smoke.py target/debug

  firefox:
    name: Firefox extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test explicit handoff and permission boundaries
        run: node --test extensions/firefox/tests/*.test.js
      - name: Lint Firefox manifest and sources
        run: npx --yes web-ext@10.8.0 lint --source-dir extensions/firefox --ignore-files 'tests' 'tests/**' package.json README.md
